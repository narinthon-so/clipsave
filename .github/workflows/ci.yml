name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release

      - name: e2e (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -STA -ExecutionPolicy Bypass -File tests/e2e-windows.ps1 -Bin target/release

      - name: e2e (Linux, X11 via xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb xclip
          xvfb-run -a bash tests/e2e-unix.sh target/release/clipsave

      - name: e2e (macOS)
        if: runner.os == 'macOS'
        run: bash tests/e2e-unix.sh target/release/clipsave
