name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { name: macos-universal, os: macos-latest, target: universal }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --target ${{ matrix.target }}
          $dir = "target/${{ matrix.target }}/release"
          Compress-Archive -Path "$dir/clipsave.exe", "$dir/clipsavew.exe", README.md, LICENSE `
            -DestinationPath "clipsave-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Linux (static musl)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }} --bin clipsave
          tar -czf "clipsave-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" \
            -C target/${{ matrix.target }}/release clipsave -C "$GITHUB_WORKSPACE" README.md LICENSE

      - name: macOS (universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --bin clipsave --target aarch64-apple-darwin
          cargo build --release --bin clipsave --target x86_64-apple-darwin
          lipo -create -output clipsave \
            target/aarch64-apple-darwin/release/clipsave target/x86_64-apple-darwin/release/clipsave
          tar -czf "clipsave-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" clipsave README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: clipsave-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum clipsave-* > SHA256SUMS.txt
          gh release create "${{ github.ref_name }}" clipsave-* SHA256SUMS.txt \
            --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
