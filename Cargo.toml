[package]
name = "clipsave"
version = "0.1.0"
edition = "2021"
description = "Save the clipboard image as a PNG file — from a file manager right-click or the command line."
license = "MIT"
repository = "https://github.com/narinthon-so/clipsave"
readme = "README.md"
keywords = ["clipboard", "image", "png", "explorer", "cli"]
categories = ["command-line-utilities"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "clipsave"
path = "src/main.rs"

# Windowless twin for the Explorer context menu (no console flash). Same code as `clipsave`.
[[bin]]
name = "clipsavew"
path = "src/bin/clipsavew.rs"

[dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
png = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
